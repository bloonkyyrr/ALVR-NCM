name: Create release

env:
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: false
        default: ""

jobs:
  prepare_release:
    runs-on: ubuntu-24.04
    outputs:
      release_ref: ${{ steps.output_ref.outputs.release_ref }}
      version_tag: ${{ steps.bump_version.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version
        id: bump_version
        env:
          RUST_BACKTRACE: 1
        run: |
          versionarg="${{ github.event.inputs.version }}"
          [ -n "$versionarg" ] && versionarg="--version $versionarg" || versionarg=""
          out=$(cargo xtask bump $versionarg)
          echo "$out"
          cargo update -p alvr_common
          echo "version_tag=$(echo "$out" | grep -P '^v.*$')" >> $GITHUB_OUTPUT

      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[Auto] Bump version"

      - name: Output ref for later checkouts
        id: output_ref
        run: echo "release_ref=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build_windows_streamer:
    runs-on: windows-latest
    needs: [prepare_release]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install zip unzip pkgconfiglite

      - name: Build and package ALVR
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo xtask package-streamer --gpl --ci
          cargo xtask package-launcher --ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-streamer
          path: ./build/alvr_*.zip

  build_android_client:
    runs-on: ubuntu-latest
    needs: [prepare_release]
    env:
      ANDROID_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ANDROID_KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-32"

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Build and package ALVR
        env:
          RUST_BACKTRACE: 1
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo xtask package-client --ci

      - name: Sign APK
        uses: ilharp/sign-android-release@v2
        id: sign_apk
        if: ${{ env.ANDROID_SIGNING_KEY != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_STORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        with:
          releaseDir: build/alvr_client_android
          signingKey: ${{ env.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ env.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ env.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ env.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-client
          path: ${{ steps.sign_apk.outputs.signedFile || 'build/alvr_client_android/*.apk' }}

  publish_release:
    runs-on: ubuntu-latest
    needs:
      [
        prepare_release,
        build_windows_streamer,
        build_android_client,
      ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.version_tag }}
          draft: true
          prerelease: false
          target_commitish: ${{ needs.prepare_release.outputs.release_ref }}
          files: artifacts/**
